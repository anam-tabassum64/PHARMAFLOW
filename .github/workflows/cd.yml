name: PHARMAFLOW CD Pipeline

on:
  workflow_run:
    workflows: ["PHARMAFLOW CI Pipeline"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-images:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      image_tag: ${{ steps.tag_calc.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Image Tags
        id: tag_calc
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        id: repo_owner
        run: |
          echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pharmaflow-backend:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/pharmaflow-backend:latest
            ghcr.io/${{ env.OWNER }}/pharmaflow-backend:sha-${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pharmaflow-frontend:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/pharmaflow-frontend:latest
            ghcr.io/${{ env.OWNER }}/pharmaflow-frontend:sha-${{ github.sha }}

      - name: Record Immutable Image Digests
        run: |
          echo "### Container Images Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Image**: \`ghcr.io/${{ env.OWNER }}/pharmaflow-backend:${{ env.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Image**: \`ghcr.io/${{ env.OWNER }}/pharmaflow-frontend:${{ env.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-ec2:
    name: Deploy to AWS EC2
    needs: [publish-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC Claims
        continue-on-error: true
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
            PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null)
            SUB=$(echo "$PAYLOAD" | jq -r '.sub')
            AUD=$(echo "$PAYLOAD" | jq -r '.aud')
            REPO=$(echo "$PAYLOAD" | jq -r '.repository')
            echo "::notice title=OIDC_SUB::$SUB"
            echo "::notice title=OIDC_AUD::$AUD"
            echo "::notice title=OIDC_REPO::$REPO"
            echo "### GitHub OIDC Token Inspection" >> $GITHUB_STEP_SUMMARY
            echo "- **Subject (\`sub\`)**: \`$SUB\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Audience (\`aud\`)**: \`$AUD\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Repository**: \`$REPO\`" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "$PAYLOAD" | jq . >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure AWS Credentials via OIDC
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::789223369238:role/PHARMAFLOW-GitHubActions-Deploy
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Check EC2 Deployment Readiness
        id: check_ec2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '15.252.139.104' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ec2_ready=false" >> $GITHUB_OUTPUT
            echo "::notice ::EC2 SSH key secret not yet configured. Skipping remote host deployment until EC2 instance is launched."
          else
            echo "ec2_ready=true" >> $GITHUB_OUTPUT
            echo "Target EC2 Host: $EC2_HOST"
          fi

      - name: Authorize GitHub Runner IP in Security Group
        id: whitelist_ip
        continue-on-error: true
        if: steps.check_ec2.outputs.ec2_ready == 'true'
        run: |
          echo "=== AWS Assumed Role Identity ==="
          aws sts get-caller-identity
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "runner_ip=$RUNNER_IP" >> $GITHUB_OUTPUT
          echo "Authorizing Runner IP: $RUNNER_IP in sg-0408387154c9a1dab"
          AUTH_OUT=$(aws ec2 authorize-security-group-ingress \
            --group-id sg-0408387154c9a1dab \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" 2>&1 || true)
          SG_INFO=$(echo "$AUTH_OUT" | tr '\n' ' ' | cut -c1-200)
          echo "::notice title=SG_INGRESS_STATUS::$SG_INFO"
          echo "### AWS Security Group Ingress Result" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$AUTH_OUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Execute Remote Zero-Downtime Deployment
        if: steps.check_ec2.outputs.ec2_ready == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '15.252.139.104' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Diagnostic SSH probe
          SSH_TEST=$(ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$EC2_USER@$EC2_HOST" "echo SSH_CONNECTED" 2>&1 || true)
          SSH_INFO=$(echo "$SSH_TEST" | tail -n 5 | tr '\n' ' ' | cut -c1-200)
          echo "::notice title=SSH_STATUS::$SSH_INFO"
          echo "### SSH Connectivity Test Result" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$SSH_TEST" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Docker authentication for GHCR on EC2 host
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$EC2_USER@$EC2_HOST" "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin 2>/dev/null || true"

          # Sync Compose, Nginx & Monitoring configuration to /opt/pharmaflow
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$EC2_USER@$EC2_HOST" "mkdir -p /opt/pharmaflow/nginx /opt/pharmaflow/monitoring/prometheus /opt/pharmaflow/monitoring/grafana/provisioning/datasources /opt/pharmaflow/monitoring/grafana/provisioning/dashboards /opt/pharmaflow/monitoring/grafana/dashboards /opt/pharmaflow/scripts"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 docker-compose.prod.yml "$EC2_USER@$EC2_HOST:/opt/pharmaflow/docker-compose.prod.yml"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 nginx/nginx.conf "$EC2_USER@$EC2_HOST:/opt/pharmaflow/nginx/nginx.conf"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 monitoring/prometheus/prometheus.yml "$EC2_USER@$EC2_HOST:/opt/pharmaflow/monitoring/prometheus/prometheus.yml"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 monitoring/grafana/provisioning/datasources/datasource.yml "$EC2_USER@$EC2_HOST:/opt/pharmaflow/monitoring/grafana/provisioning/datasources/datasource.yml"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 monitoring/grafana/provisioning/dashboards/dashboards.yml "$EC2_USER@$EC2_HOST:/opt/pharmaflow/monitoring/grafana/provisioning/dashboards/dashboards.yml"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 monitoring/grafana/dashboards/pharmaflow_dashboard.json "$EC2_USER@$EC2_HOST:/opt/pharmaflow/monitoring/grafana/dashboards/pharmaflow_dashboard.json"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 scripts/backup.sh scripts/restore.sh scripts/rollback.sh "$EC2_USER@$EC2_HOST:/opt/pharmaflow/scripts/"

          # Deploy container stack with rollback verification
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$EC2_USER@$EC2_HOST" "bash -s" << EOF
            set -e
            cd /opt/pharmaflow
            chmod +x scripts/*.sh

            echo "Recording deployment version: $IMAGE_TAG"
            echo "$IMAGE_TAG" >> .deployment_history

            echo "Pulling latest images from GHCR..."
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose -f docker-compose.prod.yml pull

            echo "Deploying updated services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml restart nginx prometheus grafana || true

            echo "Verifying service health..."
            RETRIES=25
            until (curl -s -f http://localhost/health > /dev/null && curl -s -f http://localhost/ready > /dev/null && curl -s -f http://localhost/ > /dev/null) || [ \$RETRIES -eq 0 ]; do
              echo "Waiting for health check... (\$RETRIES left)"
              curl -s -I http://localhost/ || true
              sleep 5
              RETRIES=\$((RETRIES - 1))
            done

            if [ \$RETRIES -eq 0 ]; then
              echo "ERROR: Healthcheck probe failed. Inspecting container logs:"
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=40 frontend nginx || true
              echo "Initiating automatic rollback!"
              bash scripts/rollback.sh
              exit 1
            fi

            echo "Seeding initial inventory catalog if empty..."
            docker compose -f docker-compose.prod.yml exec -T backend python -m app.seed.seed_data || true

            echo "Deployment healthy and verified!"
          EOF

      - name: Revoke GitHub Runner IP from Security Group
        if: always()
        run: |
          RUNNER_IP="${{ steps.whitelist_ip.outputs.runner_ip }}"
          if [ -n "$RUNNER_IP" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id sg-0408387154c9a1dab \
              --protocol tcp \
              --port 22 \
              --cidr "${RUNNER_IP}/32" 2>/dev/null || true
          fi
