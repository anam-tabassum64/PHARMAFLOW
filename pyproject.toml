[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module level import not at top of file (sys.path manipulation in scripts/tests)
    "E712",  # comparison to True/False (SQLAlchemy query syntax requires Column == True)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
